# Native launch screen for the captain flavor (EasyWay Captain).
#
# Deliberately identical to the client and dashboard configs — see
# flutter_native_splash_client.yaml for why the OS frame is shared across
# flavors and where the generated assets come from.
flutter_native_splash:
  color: "#F9FAFB"
  color_dark: "#0F172A"
  image: "assets/branding/splash_mark.png"
  image_dark: "assets/branding/splash_mark.png"
  android: true
  ios: true
  web: false
  android_12:
    image: "assets/branding/splash_mark_android12.png"
    image_dark: "assets/branding/splash_mark_android12.png"
    color: "#F9FAFB"
    color_dark: "#0F172A"
