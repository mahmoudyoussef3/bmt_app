# Default native launch screen, used when the generator runs without --path.
# Kept in sync with config/splash/*.yaml, which is where the per-flavor configs
# live and where the reasoning is documented.
flutter_native_splash:
  color: "#F9FAFB"
  color_dark: "#0F172A"
  image: "assets/branding/splash_mark.png"
  image_dark: "assets/branding/splash_mark.png"

  android: true
  ios: true
  web: false

  android_12:
    image: "assets/branding/splash_mark_android12.png"
    image_dark: "assets/branding/splash_mark_android12.png"
    color: "#F9FAFB"
    color_dark: "#0F172A"
